<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>finance paper-金融手账</title>
    <link rel="icon" type="image/x-icon" href="../logo.ico">
    <link href="bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="position-relative">

<div class="theme-toggle-wrapper">
    <button id="themeToggle" class="btn btn-fancy btn-theme-grad rounded-pill px-4 py-2 d-flex align-items-center gap-2">
        <span id="themeIcon">🌙</span> <span id="themeText">暗色模式</span>
    </button>
</div>

<div class="container py-5 mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="m-0 mx-auto">⚙️ 类别与系统设置</h2>
        <button id="backToDashboard" class="btn btn-fancy btn-settings-grad rounded-pill position-absolute px-4 py-2" style="right: 180px; top: 20px;">🔙 返回看板</button>
    </div>

    <!-- 结转配置 -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="card bg-primary bg-opacity-10 border-primary border-opacity-25">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="mb-1 text-primary">🔄 预算结转兜底设置</h5>
                        <p class="text-muted small mb-0">当某个类别<b>未开启</b>“独立结转”时，其余额将汇总并补充到此处设置的类别中。</p>
                    </div>
                    <div class="d-flex gap-2">
                        <select id="surplusTargetSelect" class="form-select form-select-sm" style="width: 200px; cursor: pointer;"></select>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="row">
        <!-- 预算类别管理 -->
        <div class="col-md-7">
            <div class="card h-100">
                <div class="card-header">📋 预算类别管理 (拖拽排序)</div>
                <div class="card-body">
                    <form id="manageCategoryForm" class="row g-2 mb-4">
                        <input type="hidden" id="oldCategoryName" name="old_name">
                        <div class="col-md-6"><input type="text" class="form-control form-control-sm" id="newCategoryInput" name="name" placeholder="类别名称" required></div>
                        <div class="col-md-3"><input type="number" step="0.01" class="form-control form-control-sm" id="newCategoryLimit" name="limit" placeholder="上限" required></div>
                        <div class="col-md-3"><input type="number" step="0.01" class="form-control form-control-sm" id="newCategoryInitial" name="initial" placeholder="固定花费" required></div>
                        <div class="col-12 d-flex align-items-center justify-content-between mt-3">
                            <div class="form-check form-switch small">
                                <input class="form-check-input" type="checkbox" id="rolloverToggle" name="rollover" style="cursor: pointer;">
                                <label class="form-check-label fw-bold text-success" for="rolloverToggle" style="cursor: pointer;">独立结转</label>
                            </div>
                            <button type="submit" id="submitCategoryBtn" class="btn btn-sm btn-fancy btn-record-grad px-4 text-white">添加预算类别</button>
                        </div>
                    </form>
                    <ul class="list-group list-group-flush" id="categoryList"></ul>
                </div>
            </div>
        </div>

        <!-- 资产类别管理 -->
        <div class="col-md-5">
            <div class="card h-100">
                <div class="card-header">💼 资产类别管理 (拖拽排序)</div>
                <div class="card-body">
                    <form id="addAssetCategoryForm" class="input-group input-group-sm mb-3">
                        <input type="text" class="form-control" name="name" placeholder="新资产类别" required>
                        <button type="submit" class="btn btn-fancy btn-theme-grad text-white px-3">添加</button>
                    </form>
                    <ul class="list-group list-group-flush" id="assetCategoryList"></ul>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="bootstrap.bundle.min.js"></script>
<script src="renderer.js"></script>
</body>
</html>
