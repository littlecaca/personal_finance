<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>finance paper-金融手账</title>
    <link rel="icon" type="image/x-icon" href="../logo.ico">
    <link href="bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="position-relative">

<div class="theme-toggle-wrapper">
    <button id="themeToggle" class="btn btn-fancy btn-theme-grad rounded-pill px-4 py-2 d-flex align-items-center gap-2">
        <span id="themeIcon">🌙</span> <span id="themeText">暗色模式</span>
    </button>
</div>

<div id="mainView" class="container py-5 mt-4">
    <div class="d-flex justify-content-end align-items-center mb-4">
        <button id="goToSettings" class="btn btn-fancy btn-settings-grad rounded-pill position-absolute px-4 py-2" style="right: 180px; top: 20px;">⚙️ 管理类别</button>
    </div>

    <div class="row mb-4 align-items-stretch">
        <div class="col-lg-5 mb-4 mb-lg-0">
            <div class="card h-100">
                <div class="card-header"><span id="currentMonthLabel"></span> 预算与进度</div>
                <div class="card-body">
                    <div class="text-center mb-4">
                        <h6 class="text-muted mb-1">本月总开销 (CNY)</h6>
                        <div class="total-spend-text text-danger" id="totalMonthSpendDisplay">¥ 0.00</div>
                    </div>
                    <hr class="mb-4">
                    <div id="budgetProgressContainer"></div>
                </div>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>🛒 记录日常开销</span>
                    <div class="d-flex align-items-center gap-2">
                        <label class="small text-muted">选择时间:</label>
                        <select class="form-select form-select-sm" style="width: auto;" id="yearSelector"></select>
                        <select class="form-select form-select-sm" style="width: auto;" id="monthSelector"></select>
                    </div>
                </div>
                <div class="card-body">
                    <form id="addExpenseForm" class="mb-4">
                        <div class="row g-2">
                            <div class="col-md-3">
                                <select class="form-select" name="category" id="expenseCategory" required></select>
                            </div>
                            <div class="col-md-3">
                                <input type="number" step="0.01" class="form-control" name="amount" placeholder="金额 (¥)" required>
                            </div>
                            <div class="col-md-4">
                                <input type="text" class="form-control" name="description" placeholder="描述" required>
                            </div>
                            <div class="col-md-2">
                                <button type="submit" class="btn btn-danger w-100">添加</button>
                            </div>
                        </div>
                    </form>

                    <h6 class="text-muted mb-3 d-flex justify-content-between align-items-center">
                        <span>近期开销记录 <span id="currentPageLabel"></span></span>
                        <span class="badge bg-secondary" id="totalCountLabel"></span>
                    </h6>
                    <div class="table-responsive">
                        <table class="table table-sm table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>时间</th><th>类别</th><th>描述</th><th class="text-end">金额</th><th class="text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody id="expenseListBody"></tbody>
                        </table>
                    </div>

                    <nav class="mt-3">
                        <ul class="pagination pagination-sm justify-content-center" id="paginationControls"></ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <!-- 资产分布卡片 -->
            <div class="card mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>📊 资产分布与更新</span>
                    <button id="recordAssetBtn" class="btn btn-sm btn-fancy btn-record-grad rounded-pill px-3">记录</button>
                </div>
                <div class="card-body">
                    <div class="row align-items-center py-2">
                        <div class="col-md-5 d-flex flex-column align-items-center justify-content-center mb-4 mb-md-0">
                            <h6 class="text-muted mb-1">当前资产总额 (CNY)</h6>
                            <div class="total-spend-text text-success mb-3" id="totalAssetsDisplay">¥ 0.00</div>
                            <div style="width: 100%; max-width: 240px;"><canvas id="assetChart"></canvas></div>
                        </div>
                        <div class="col-md-7">
                            <ul class="list-group list-group-flush" id="assetList"></ul>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 资产趋势卡片 -->
            <div class="card mb-4">
                <div class="card-header">📈 资产变化趋势</div>
                <div class="card-body">
                    <div class="py-2">
                        <h6 class="text-muted mb-3 small">提示：点击图中的数据点可删除对应的历史记录</h6>
                        <div style="height: 300px;"><canvas id="historyChart"></canvas></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="bootstrap.bundle.min.js"></script>
<script src="chart.js"></script>
<script src="renderer.js"></script>
</body>
</html>
